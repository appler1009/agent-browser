name: Release

# Push a tag matching VERSION (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to build a signed,
# notarized universal binary and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TEAM_ID: ${{ secrets.TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($VERSION)"
            exit 1
          fi

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up code signing
        uses: ./.github/actions/setup-signing
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          asc-key: ${{ secrets.ASC_KEY_P8 }}

      - name: Build, sign, test, notarize, package
        run: Scripts/package.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/agent-browser-${GITHUB_REF_NAME#v}-macos.tar.gz" dist/SHA256SUMS.txt \
            --title "agent-browser ${GITHUB_REF_NAME#v}" \
            --generate-notes

      - name: Clean up signing
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/asc-key.p8"
