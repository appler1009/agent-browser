name: Release

# Push a tag matching VERSION (e.g. `git tag v0.1.1 && git push origin v0.1.1`) to build the signed, notarized
# app (DMG) and binary and publish them as a GitHub release. Run it by hand (Actions > Release > Run workflow)
# for a dry run: it builds, signs and notarizes the same way and attaches the files as a workflow artifact,
# without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TEAM_ID: ${{ secrets.TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches VERSION
        if: github.ref_type == 'tag'
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($VERSION)"
            exit 1
          fi

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up code signing
        uses: ./.github/actions/setup-signing
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          asc-key: ${{ secrets.ASC_KEY_P8 }}

      - name: Build, sign, test, notarize, package
        env:
          REQUIRE_DMG_STYLE: '1'   # never ship a DMG without its background
        run: Scripts/package.sh

      - name: Keep the files from a dry run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: agent-browser-dry-run
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          retention-days: 7

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/AgentBrowser-${GITHUB_REF_NAME#v}.dmg" \
            "dist/agent-browser-${GITHUB_REF_NAME#v}-macos.tar.gz" dist/SHA256SUMS.txt \
            --title "agent-browser ${GITHUB_REF_NAME#v}" \
            --generate-notes

      - name: Clean up signing
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/asc-key.p8"
