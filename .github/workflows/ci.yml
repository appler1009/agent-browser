name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # Tart VM runner on the maintainer's Mac mini. If it is offline, set the repository variable
    # CI_RUNS_ON to '"macos-26"' (with the quotes) to run on a GitHub-hosted runner instead.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","tart"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The Tart image already has the Xcode we want; only GitHub-hosted images need selecting.
      - name: Select latest Xcode
        if: runner.environment == 'github-hosted'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: swift build
      - name: Integration tests
        run: |
          export PATH="/opt/homebrew/bin:$PATH"  # Homebrew is not on PATH in the Tart VM shell
          Tests/integration.sh
